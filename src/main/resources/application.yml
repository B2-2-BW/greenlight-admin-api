spring.application.name: greenlight-admin-api
spring.profiles.active: local

server:
  port: 28080
  url: ${SERVER_URL}
  web-url: ${WEB_SERVER_URL}

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${STORAGE_POSTGRESQL_URL}
    username: ${STORAGE_POSTGRESQL_USERNAME}
    password: ${STORAGE_POSTGRESQL_PASSWORD}
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_DEV_HOST:127.0.0.1}
      port: ${REDIS_DEV_PORT:6379}
      password: ${REDIS_PASSWORD}
      cluster:
        max-redirects: 5
        nodes: ${REDIS_CLUSTER_NODES:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      connect-timeout: 3s
      timeout: 5s
      lettuce:
        pool:
          time-between-eviction-runs: 300000
  web:
    error:
      include-message: always
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.winten.greenlight
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true

logging:
  config: classpath:logback/logback-${spring.profiles.active}.xml
  level:
    root: INFO
    com.winten: DEBUG

influxdb:
  url: ${INFLUXDB_URL}
  token: ${INFLUXDB_TOKEN}
  org: ${INFLUXDB_ORG}
  default-bucket: ${INFLUXDB_BUCKET}

springdoc:
  swagger-ui:
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    display-request-duration: true
    defaultModelsExpandDepth: -1
  api-docs:
    path: /api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match:
    - /**

aws:
  s3:
    url:
      image-bucket: ${AWS_S3_IMAGE_BUCKET}

redis:
  key-prefix: ${REDIS_KEY_PREFIX}
  connection-type: ${REDIS_CONNECTION_TYPE:standalone}

jwt:
  secret: ${JWT_SECRET}
  expiration:
    access: 1800 # 30분
    refresh: 1209600 # 14일

---
spring.config.activate.on-profile: local
---
spring.config.activate.on-profile: dev
---
spring.config.activate.on-profile: live

logging:
  level:
    root: ERROR
    com.winten: ERROR
    com.winten.greenlight: ERROR